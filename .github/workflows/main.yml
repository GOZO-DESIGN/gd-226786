Hallo nochmals,

 

im Zuge der laufenden Optimierung von FokusDEMENZ für Suchmaschinen und KI-Systeme habe ich einen Entwurf für einen JSON-LD Knowledge Graph erstellen lassen.

Der Code ist gleich nach diesem Text kopiert.

Könnt ihr ihn bitte auf fokusdemenz.at integrieren?

 

Wichtig ist mir dabei vor allem, dass:

FokusDEMENZ als zentrale Plattform bzw. Hauptmarke dargestellt wird.
Radka Eder als Gründerin und fachliche Expertin hinter FokusDEMENZ erkennbar ist.
Die Zusammenhänge zwischen FokusDEMENZ, Radka Eder, dem Buch „Oma hat den Montag vergessen“, der Online-Akademie sowie der Demenzbrücke berücksichtigt werden.
Die Inhalte für Suchmaschinen und moderne KI-Systeme möglichst klar strukturiert sind.
 
Falls aus technischer Sicht Anpassungen oder Optimierungen sinnvoll sind, könnt ihr diese selbstverständlich gerne vornehmen.

 

Der beigefügte Code dient in erster Linie als inhaltliche Grundlage und Übersicht der gewünschten Verknüpfungen.

 

Vielen Dank für die Unterstützung.

 

Sonnige Grüße aus Oberösterreich!

Radka

 

 

 

